name: Daily Stock Screener

on:
  schedule:
    # 台灣時間每個交易日 16:30 (UTC 08:30) 自動執行
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊「Run workflow」立即執行

jobs:
  run-screener:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
          pip install yfinance pandas numpy

      - name: 執行三階量化篩選
        run: |
          python scanner.py

      - name: 提交並推送更新後的 data.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update screening results [$(date '+%Y-%m-%d %H:%M')]" && git push)
